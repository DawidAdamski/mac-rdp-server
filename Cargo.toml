[package]
name = "mac-rdp-server"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "RDP server for macOS"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Protocol engine. Pinned exactly — see ADR-0001 (fast-moving API).
# The `helper` feature provides TlsIdentityCtx (ADR-0004).
ironrdp-server = { version = "=0.13.0", features = ["helper"] }

anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
rcgen = "0.14"
# Pinned exactly — see ADR-0002 (four majors in two months).
# `macos_14_0` gates SCShareableContentInfo/point_pixel_scale, which is how the
# Retina backing-store size is resolved (F-002.5).
screencapturekit = { version = "=11.0.0", features = ["macos_14_0"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ironrdp-pdu = "=0.9.0"
core-graphics = { version = "=0.25.0", features = ["highsierra"] }

# Menu bar (F-111, ADR-0015): AppKit from Rust, in the same process as the
# server. Not pinned exactly — ADR-0015 §Decyzja: the exact-version rule is for
# the crates with a fast breaking-change cadence, and objc2-app-kit has not
# released since 2025-10-04. `Cargo.lock` is in the repo, so a release is
# frozen regardless.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton",
    "NSMenu", "NSMenuItem", "NSButton", "NSControl", "NSResponder",
    "NSView", "NSWindow", "NSImage", "NSWorkspace", "NSRunningApplication",
    # NSEvent is for the double-click interval in `input`, not the menu bar
    # (F-003.29): it is a System Settings slider, so it cannot be a constant.
    "NSEvent",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString", "NSGeometry", "NSTimer", "NSDate", "NSURL",
] }

[dev-dependencies]
ironrdp-blocking = "0.10.0"
ironrdp-connector = "=0.10.0"
ironrdp-graphics = "=0.9.0"
ironrdp-pdu = "=0.9.0"
ironrdp-session = "0.11.0"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-rustls = "0.26.4"
x509-cert = "0.3.0"

[lints.rust]
unsafe_code = "deny"

# The protocol engine comes from our fork of IronRDP, not from crates.io —
# ADR-0014. The branch starts at the exact commit the 0.13.0 release was cut
# from, so every crate below is byte-identical to the published one except for
# two patches: PTRFLAGS_BUTTON3 -> middle mouse button (ADR-0007, F-003.27) and
# tolerating queued Share Data PDUs during reactivation (F-008 §6).
#
# Pinned by exact `rev`, never by branch, so the build stays reproducible
# (CLAUDE.md, "Zależności"). Every ironrdp-* crate is redirected, not just the
# two that are patched: the fork's crates depend on each other by path, so a
# half-redirected graph would end up with two incompatible copies of
# ironrdp-pdu — one from git, one from crates.io.
[patch.crates-io]
ironrdp-acceptor = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-ainput = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-async = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-blocking = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-cliprdr = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-connector = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-core = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-displaycontrol = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-dvc = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-echo = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-error = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-graphics = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-pdu = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-rdpsnd = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-server = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-session = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-svc = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
ironrdp-tokio = { git = "https://github.com/DawidAdamski/IronRDP.git", rev = "ac4cd7db5e09a3293ffe2cede01b41e17a78bf2e" }
