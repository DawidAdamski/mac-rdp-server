name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # macOS only: this project targets macOS and wave 1 onwards links against
    # ScreenCaptureKit (ADR-0002).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Verify Cargo.lock is committed and up to date
        run: cargo check --locked

      # F-110.11: docs/ is generated from README.md and SECURITY.md, so the
      # site cannot be allowed to drift away from them unnoticed.
      - name: Verify the GitHub Pages content is in step with the Markdown
        run: python3 packaging/build-docs.py --check
