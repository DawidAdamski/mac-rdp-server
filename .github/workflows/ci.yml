name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # macOS only: this project targets macOS and wave 1 onwards links against
    # ScreenCaptureKit (ADR-0002).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Verify Cargo.lock is committed and up to date
        run: cargo check --locked

      # F-110.11: docs/ is generated from README.md and SECURITY.md, so the
      # site cannot be allowed to drift away from them unnoticed.
      - name: Verify the GitHub Pages content is in step with the Markdown
        run: python3 packaging/build-docs.py --check

      # F-110.17 / AC-11: the release notes come from CHANGELOG.md, and a
      # version with no section there must stop the release rather than
      # publish an empty description. Checked on every push, because the
      # release workflow runs too late to be the place this is discovered.
      - name: Verify the release notes come from the changelog
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          notes=$(packaging/release-notes.sh "$version")
          case "$notes" in
            *"grant Screen Recording and Accessibility again"*) ;;
            *) echo "notes for $version lack the permission warning" >&2; exit 1 ;;
          esac
          if packaging/release-notes.sh 0.0.0-absent >/dev/null 2>&1; then
            echo "a version absent from CHANGELOG.md must fail, it did not" >&2
            exit 1
          fi
          echo "release notes for $version come from CHANGELOG.md"
